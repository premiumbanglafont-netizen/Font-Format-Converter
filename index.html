<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicode to Bijoy Converter</title>
    <link rel="stylesheet" href="config/css/tailwind.min.css">
    <link rel="stylesheet" href="config/css/main.css">
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-center">ইউনিকোড টু বিজয় কনভার্টার</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block font-medium mb-2">ইউনিকোড টেক্সট (Unicode):</label>
                <textarea id="unicode_text" class="w-full h-40 p-2 border rounded-md" placeholder="এখানে ইউনিকোড টেক্সট লিখুন..."></textarea>
            </div>
            <div>
                <label class="block font-medium mb-2">বিজয় টেক্সট (Bijoy):</label>
                <textarea id="bijoy_text" class="w-full h-40 p-2 border rounded-md" placeholder="এখানে বিজয় আউটপুট আসবে..."></textarea>
            </div>
        </div>

        <div class="mt-4 flex gap-3 justify-center">
            <button id="convert_btn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">কনভার্ট করুন</button>
            <button id="clear_btn" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600">ক্লিয়ার</button>
        </div>
    </div>

    <!-- Inline Conversion Logic -->
    <script>
        function convertUnicodeToBijoy(src) {
            if (!src) return '';
            
            // Map table
            var map = {
                'অ': 'A', 'আ': 'Av', 'ই': 'Bi', 'ঈ': 'B', 'উ': 'C', 'ঊ': 'D', 'ঋ': 'E', 'এ': 'G', 'ঐ': 'H', 'ও': 'I', 'ঔ': 'J',
                'ক': 'K', 'খ': 'L', 'গ': 'M', 'ঘ': 'N', 'ঙ': 'O', 'চ': 'P', 'ছ': 'Q', 'জ': 'R', 'ঝ': 'S', 'ঞ': 'T',
                'ট': 'U', 'ঠ': 'V', 'ড': 'W', 'ঢ': 'X', 'ণ': 'Y', 'ত': 'Z', 'থ': '_', 'দ': 'd', 'ধ': 'e', 'ন': 'f',
                'প': 'g', 'ফ': 'h', 'ব': 'i', 'ভ': 'j', 'ম': 'k', 'য': 'l', 'র': 'm', 'ল': 'n', 'শ': 'o', 'ষ': 'p',
                'স': 'q', 'হ': 'r', 'ড়': 's', 'ঢ়': 't', 'য়': 'u', 'ৎ': 'v', 'ং': 'w', 'ঃ': 'x', 'ঁ': 'y',
                'া': 'v', 'ি': 'i', 'ী': 'I', 'ু': 'u', 'ূ': 'U', 'ৃ': 'r', 'ে': 'e', 'ৈ': 'S', 'ো': 'ো', 'ৌ': 'O',
                '্': '&', '০': '0', '১': '1', '২': '2', '৩': '3', '৪': '4', '৫': '5', '৬': '6', '৭': '7', '৮': '8', '৯': '9'
            };

            // Basic conversion
            var res = '';
            for (var i = 0; i < src.length; i++) {
                var ch = src[i];
                res += map[ch] ? map[ch] : ch;
            }
            return res;
        }

        function runConversion() {
            var src = document.getElementById('unicode_text').value;
            
            // Check if global script functions exist, otherwise use fallback
            if (typeof convert2bijoy === 'function') {
                document.getElementById('bijoy_text').value = convert2bijoy(src);
            } else if (typeof UnicodeToBijoy === 'function') {
                document.getElementById('bijoy_text').value = UnicodeToBijoy(src);
            } else {
                document.getElementById('bijoy_text').value = convertUnicodeToBijoy(src);
            }
        }

        document.getElementById('convert_btn').addEventListener('click', runConversion);
        document.getElementById('unicode_text').addEventListener('input', runConversion);

        document.getElementById('clear_btn').addEventListener('click', function() {
            document.getElementById('unicode_text').value = '';
            document.getElementById('bijoy_text').value = '';
        });
    </script>
    
    <!-- Load JS Files -->
    <script src="config/js/unicode.js"></script>
    <script src="config/js/bijoy.js"></script>
</body>
</html>
