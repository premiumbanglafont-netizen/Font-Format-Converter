<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unicode ANSI Converter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f3f3f3;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: #f8f8f8;
      padding: 15px;
      border-radius: 12px;
    }

    /* Header Banner */
    .header {
      background: linear-gradient(90deg, #ff0055, #ff5500);
      color: white;
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* Tab Buttons */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .tab-btn {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #e0e0e0;
      color: #777;
    }

    .tab-btn.active {
      background: linear-gradient(90deg, #ff0055, #ff5500);
      color: white;
    }

    /* Converter Area Layout */
    .converter-box {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    @media (max-width: 650px) {
      .converter-box {
        flex-direction: column;
      }
    }

    .panel {
      flex: 1;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* Panel Header */
    .panel-header {
      background: linear-gradient(90deg, #ff0055, #ff5500);
      color: white;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title {
      font-size: 16px;
      font-weight: bold;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: white;
      color: #ff0055;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .action-btn:hover {
      background: #f0f0f0;
    }

    /* Textarea Area */
    textarea {
      width: 100%;
      height: 250px;
      border: none;
      padding: 12px;
      font-size: 16px;
      resize: vertical;
      outline: none;
      color: #444;
    }

    .swap-icon {
      font-size: 20px;
      color: #888;
      font-weight: bold;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">Converter</div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active">Unicode &lt;&gt; ANSI V1</button>
      <button class="tab-btn">Unicode &lt;&gt; ANSI V2</button>
      <button class="tab-btn">Unicode &lt;&gt; ANSI V3</button>
    </div>

    <!-- Main Converter -->
    <div class="converter-box">
      <!-- Unicode Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Unicode</span>
          <div class="btn-group">
            <button class="action-btn" onclick="clearText('unicodeInput')">✕ Clear</button>
            <button class="action-btn" onclick="copyText('unicodeInput')">📋 Copy</button>
            <button class="action-btn" onclick="pasteText('unicodeInput')">📋 Paste</button>
          </div>
        </div>
        <textarea id="unicodeInput" placeholder="এখানে ইউনিকোড লিখুন" oninput="convertUnicodeToAnsi()"></textarea>
      </div>

      <div class="swap-icon">&lt;&gt;</div>

      <!-- ANSI Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">ANSI V1</span>
          <div class="btn-group">
            <button class="action-btn" onclick="clearText('ansiInput')">✕ Clear</button>
            <button class="action-btn" onclick="copyText('ansiInput')">📋 Copy</button>
            <button class="action-btn" onclick="pasteText('ansiInput')">📋 Paste</button>
          </div>
        </div>
        <textarea id="ansiInput" placeholder="এখানে এএনএসআই লিখুন" oninput="convertAnsiToUnicode()"></textarea>
      </div>
    </div>
  </div>

  <script>
    // Copy Function
    function copyText(id) {
      const textarea = document.getElementById(id);
      textarea.select();
      navigator.clipboard.writeText(textarea.value);
    }

    // Clear Function
    function clearText(id) {
      document.getElementById(id).value = '';
    }

    // Paste Function
    async function pasteText(id) {
      const text = await navigator.clipboard.readText();
      const textarea = document.getElementById(id);
      textarea.value = text;
      if(id === 'unicodeInput') convertUnicodeToAnsi();
      else convertAnsiToUnicode();
    }

    /* Simple Placeholder Conversion Logic 
       (বাস্তব রূপান্তরের জন্য এখানে বিজয়/ইউনিকোড কনভার্সন ম্যাপ যুক্ত করতে হবে) */
    function convertUnicodeToAnsi() {
      const unicodeVal = document.getElementById('unicodeInput').value;
      // আপনার প্রয়োজন অনুযায়ী মূল Conversion Algorithm এখানে বসাবেন
      document.getElementById('ansiInput').value = unicodeVal; 
    }

    function convertAnsiToUnicode() {
      const ansiVal = document.getElementById('ansiInput').value;
      // আপনার প্রয়োজন অনুযায়ী মূল Conversion Algorithm এখানে বসাবেন
      document.getElementById('unicodeInput').value = ansiVal;
    }
  </script>
</body>
</html>
